[project]
name = "clinically-anchored-api"
version = "0.1.0"
description = "Backend service for Clinically Anchored: check-in intake, red-flag rules, summary generation, audit log. Deployed on Railway."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.40.0",
    "cryptography>=46.0.0",
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.15.0",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
